<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Natura - Mercado Libre</title>
    <style>
        :root {
            --meli-yellow: #FFE600;
            --meli-blue: #2D3277;
            --natura-orange: #F47920;
            --bg-color: #f7f7f7;
            --card-bg: #ffffff;
            --text-main: #333333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: var(--meli-blue);
            margin-bottom: 10px;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 500;
            margin-bottom: 30px;
            color: #555;
        }

        .btn {
            background-color: var(--meli-yellow);
            color: var(--meli-blue);
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            margin-bottom: 15px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 230, 0, 0.4);
        }

        .option-btn {
            background-color: #f0f0f0;
            color: var(--text-main);
            border: 2px solid transparent;
            font-weight: normal;
        }

        .option-btn:hover {
            background-color: #e4e4e4;
            border-color: #ccc;
            transform: translateY(0);
            box-shadow: none;
        }

        .hidden {
            display: none !important;
        }

        .progress {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 20px;
            text-align: left;
        }

        .question-text {
            font-size: 1.3rem;
            margin-bottom: 30px;
            text-align: left;
            font-weight: 600;
        }

        .result-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card" id="app-container">
        <div id="start-screen">
            <h1>Trivia Natura & Mercado Libre</h1>
            <h2>¡Demuestra cuánto sabes y gana un premio exclusivo!</h2>
            <p style="margin-bottom: 30px; color: #666; font-size: 0.9rem;">Nota: Debes tener todas las respuestas correctas para ganar. Solo tienes un intento.</p>
            <button class="btn" onclick="startQuiz()">Comenzar Trivia</button>
        </div>

        <div id="quiz-screen" class="hidden">
            <div class="progress" id="progress-text">Pregunta 1 de 6</div>
            <div class="question-text" id="question-text">¿Pregunta?</div>
            <div id="options-container">
                </div>
        </div>

        <div id="result-screen" class="hidden">
            <div id="result-content">
                </div>
        </div>
    </div>

    <script>
        // Base de datos de preguntas
        const questions = [
            {
                q: "¿En qué año se lanzó la tienda oficial de Natura en Mercado Libre?",
                options: ["2024", "2022", "2025", "2023", "Ninguna de las anteriores"],
                correct: "2024"
            },
            {
                q: "¿Cuál es el claims de la misión de Natura?",
                options: ["Sentirse bien es natural", "Hace Bien Estar Bien", "Belleza con propósito", "El poder de lo natural", "Ninguna de las anteriores"],
                correct: "Hace Bien Estar Bien"
            },
            {
                q: "¿Cuál es la marca de perfumería de Natura inspirada en el movimiento, la naturaleza y la frescura del mar, famosa por sus envases que evocan la forma de una cantimplora?",
                options: ["Biografía", "Homem", "Kaiak", "Essencial", "Ninguna de las anteriores"],
                correct: "Kaiak"
            },
            {
                q: "Natura fue reconocida en el festival de Cannes como la marca más sustentable del mundo.",
                options: ["Verdadero", "Falso"],
                correct: "Verdadero"
            },
            {
                q: "¿Cuál es la línea de Natura especializada en tratamientos tecnológicos para el cuidado del rostro y antiseñales?",
                options: ["Faces", "Chronos Derma", "Una", "Natura Solar", "Ninguna de las anteriores"],
                correct: "Chronos Derma"
            },
            {
                q: "¿Cómo se llama la línea de Natura especializada en el cuidado avanzado del cabello, que utiliza biotecnología para tratar cada tipo de hebra (curva, lisa, seca o dañada)?",
                options: ["Tododia", "Ekos", "Lumina", "Ninguna de las anteriores"],
                correct: "Lumina"
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        // Comprobar si ya jugó al cargar la página
        window.onload = () => {
            if (localStorage.getItem("naturaMeliTriviaPlayed") === "true") {
                showAlreadyPlayed();
            }
        };

        function startQuiz() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            const currentQ = questions[currentQuestionIndex];
            document.getElementById('progress-text').innerText = `Pregunta ${currentQuestionIndex + 1} de ${questions.length}`;
            document.getElementById('question-text').innerText = currentQ.q;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = ''; // Limpiar opciones anteriores

            currentQ.options.forEach(option => {
                const button = document.createElement('button');
                button.className = 'btn option-btn';
                button.innerText = option;
                button.onclick = () => selectAnswer(option, currentQ.correct);
                optionsContainer.appendChild(button);
            });
        }

        function selectAnswer(selected, correct) {
            if (selected === correct) {
                score++;
            }
            
            currentQuestionIndex++;
            
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            // Guardar en el navegador que ya jugó
            localStorage.setItem("naturaMeliTriviaPlayed", "true");

            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            const resultContent = document.getElementById('result-content');
            
            if (score === questions.length) {
                // Ganador (6 de 6)
                resultContent.innerHTML = `
                    <div class="result-icon">🏆</div>
                    <h1 style="color: var(--natura-orange);">¡Felicidades!</h1>
                    <h2>Respondiste perfectamente las ${questions.length} preguntas.</h2>
                    <p>Has ganado el premio exclusivo de Natura y Mercado Libre. Revisa tu correo o contacta a soporte para validarlo.</p>
                `;
            } else {
                // Perdedor (< 6)
                resultContent.innerHTML = `
                    <div class="result-icon">😔</div>
                    <h1 style="color: #555;">¡Gracias por participar!</h1>
                    <h2>Lamentablemente no lograste el puntaje perfecto.</h2>
                    <p>Recuerda que se debían acertar todas las preguntas para obtener el premio.</p>
                `;
            }
        }

        function showAlreadyPlayed() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('result-content').innerHTML = `
                <div class="result-icon">✋</div>
                <h1 style="color: #555;">Acceso Restringido</h1>
                <h2>Ya has participado en esta trivia.</h2>
                <p>Las reglas indican que solo se permite un intento por usuario.</p>
            `;
        }
    </script>
</body>
</html>
